[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "troika-d"
version = "0.1.0b1"
description = "Lightweight screen capture for Linux"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [{name = "Scientifica"}]

classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.urls]
Homepage = "https://github.com/scientifica007/Troika-D"
Repository = "https://github.com/scientifica007/Troika-D"
Issues = "https://github.com/scientifica007/Troika-D/issues"

[project.scripts]
troika-d = "ubuntu_screen_recorder.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.scientifica007.TroikaD.desktop"]
"share/metainfo" = ["data/io.github.scientifica007.TroikaD.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["data/icons/hicolor/scalable/apps/io.github.scientifica007.TroikaD.svg"]
