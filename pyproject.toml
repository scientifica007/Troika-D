[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-screen-recorder"
version = "0.1.0"
description = "A lightweight native screen recorder for Ubuntu/X11/Wayland"
requires-python = ">=3.8"
authors = [{name = "Scientifica"}]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
ubuntu-screen-recorder = "ubuntu_screen_recorder.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
