name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Syntax check
        run: |
          python -m compileall -q src tests
