name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install native GI smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 desktop-file-utils appstream lintian
      - name: Native GTK/GDK import smoke test
        run: |
          PYTHONPATH=src /usr/bin/python3 -c "import ubuntu_screen_recorder.app"
      - name: User-local desktop install smoke test
        run: |
          bash -n scripts/install-user.sh
          bash -n scripts/uninstall-user.sh
          bash -n scripts/verify-user-install.sh
          export HOME="$RUNNER_TEMP/troika-home"
          mkdir -p "$HOME"
          bash scripts/install-user.sh
          bash scripts/verify-user-install.sh
          grep -F 'exec "$PYTHON_BIN" -m ubuntu_screen_recorder "$@"' "$HOME/.local/bin/troika-d"
          if grep -F 'ubuntu_screen_recorder ""' "$HOME/.local/bin/troika-d"; then
            echo "Generated launcher contains an install-time-expanded empty argument" >&2
            exit 1
          fi
          bash scripts/uninstall-user.sh
      - name: Desktop metadata validation
        run: |
          desktop-file-validate data/io.github.scientifica007.TroikaD.desktop
          appstreamcli validate --no-net data/io.github.scientifica007.TroikaD.metainfo.xml
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade build
          python -m build
          python - <<'PY'
          from pathlib import Path
          wheels = list(Path("dist").glob("troika_d-0.1.0b1-*.whl"))
          sdists = list(Path("dist").glob("troika_d-0.1.0b1.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Unexpected release artifacts: wheels={wheels}, sdists={sdists}")
          print("Release artifact build: PASS")
          PY
      - name: Build and verify Debian package
        run: |
          bash -n scripts/build-deb.sh
          bash -n scripts/verify-deb.sh
          DEB_PATH="$(bash scripts/build-deb.sh)"
          echo "DEB_PATH=$DEB_PATH" >> "$GITHUB_ENV"
          bash scripts/verify-deb.sh "$DEB_PATH"
          dpkg-deb --field "$DEB_PATH" Package Version Architecture Depends
          lintian --fail-on error "$DEB_PATH"
      - name: Install Debian package with APT
        run: |
          sudo apt-get install -y --no-install-recommends "./$DEB_PATH"
          test "$(command -v troika-d)" = "/usr/bin/troika-d"
          test -f /usr/share/applications/io.github.scientifica007.TroikaD.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.scientifica007.TroikaD.svg
          PYTHONPATH=/usr/lib/troika-d /usr/bin/python3 -c "import ubuntu_screen_recorder.app"
          sudo apt-get remove -y troika-d
      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: troika-d-deb-beta1
          path: dist-deb/*.deb
          if-no-files-found: error
          retention-days: 30
      - name: Syntax check
        run: |
          python -m compileall -q src tests
