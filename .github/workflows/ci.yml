name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install native GI smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gstreamer-1.0
      - name: Native GTK/GDK import smoke test
        run: |
          PYTHONPATH=src /usr/bin/python3 -c "import ubuntu_screen_recorder.app"
      - name: Syntax check
        run: |
          python -m compileall -q src tests
